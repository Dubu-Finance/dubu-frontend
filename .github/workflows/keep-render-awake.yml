name: Keep Render backend awake

on:
  schedule:
    # Render free services sleep after 15 minutes without inbound traffic.
    # Stagger the checks away from the start of each hour, when scheduled
    # GitHub Actions are more likely to be delayed.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-backend-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Render backend health
        run: >
          curl
          --fail
          --silent
          --show-error
          --location
          --max-time 90
          --retry 2
          --retry-delay 5
          https://dubu-market-server.onrender.com/health
